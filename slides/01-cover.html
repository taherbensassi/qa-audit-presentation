<section class="cx" style="position:relative;">
  <div style="position:relative; z-index:1;">
    <div class="tag">Intelligence Qualite pour Centres d'Appels</div>
    <!-- EVAVOC LOGO -->
    <div style="margin: 0 auto 18px; width:110px; height:110px;">
      <svg viewBox="0 0 110 110" width="110" height="110">
        <defs>
          <linearGradient id="evaBg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#1e1b4b"/>
            <stop offset="100%" stop-color="#0d0b22"/>
          </linearGradient>
          <linearGradient id="evaBarGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#c4b5fd"/>
            <stop offset="60%" stop-color="#8b5cf6"/>
            <stop offset="100%" stop-color="#6d28d9"/>
          </linearGradient>
          <filter id="evaGlow" x="-40%" y="-40%" width="180%" height="180%">
            <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="blur"/>
            <feMerge>
              <feMergeNode in="blur"/>
              <feMergeNode in="SourceGraphic"/>
            </feMerge>
          </filter>
        </defs>
        <rect x="3" y="3" width="104" height="104" rx="20" fill="url(#evaBg)" stroke="rgba(139,92,246,0.45)" stroke-width="1.5"/>
        <rect x="3" y="3" width="104" height="104" rx="20" fill="none" stroke="rgba(139,92,246,0.25)" stroke-width="1.5" class="eva-ring"/>
        <rect x="3" y="3" width="104" height="104" rx="20" fill="none" stroke="rgba(167,139,250,0.12)" stroke-width="3"  class="eva-ring r2"/>
        <rect class="eva-bar eb1" x="12" y="25" width="9" height="60" rx="4.5" fill="url(#evaBarGrad)" filter="url(#evaGlow)" opacity="0.85"/>
        <rect class="eva-bar eb2" x="25" y="25" width="9" height="60" rx="4.5" fill="url(#evaBarGrad)" filter="url(#evaGlow)"/>
        <rect class="eva-bar eb3" x="38" y="25" width="9" height="60" rx="4.5" fill="url(#evaBarGrad)" filter="url(#evaGlow)"/>
        <rect class="eva-bar eb4" x="51" y="25" width="9" height="60" rx="4.5" fill="url(#evaBarGrad)" filter="url(#evaGlow)"/>
        <rect class="eva-bar eb5" x="64" y="25" width="9" height="60" rx="4.5" fill="url(#evaBarGrad)" filter="url(#evaGlow)"/>
        <rect class="eva-bar eb6" x="77" y="25" width="9" height="60" rx="4.5" fill="url(#evaBarGrad)" filter="url(#evaGlow)"/>
        <rect class="eva-bar eb7" x="90" y="25" width="9" height="60" rx="4.5" fill="url(#evaBarGrad)" filter="url(#evaGlow)" opacity="0.85"/>
      </svg>
    </div>
    <h1 style="margin-bottom: 8px;" class="brand-name"><span class="gr">evaVoc</span></h1>
    <p class="sub">Chaque appel evalue. Chaque insight livre.</p>
    <div class="brand-sm">par NouraiSolutions</div>
  </div>
  <aside class="notes">
    "Bonjour. Je suis [Nom], NouraiSolutions."
